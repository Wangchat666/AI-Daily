name: Publish AI Daily
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive
        run: python3 -c "import json; d=json.load(open('data/daily.json')); assert isinstance(d['issues'], list)"
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/daily.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

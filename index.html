<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每日 AI 新闻与知识产权、生物医疗、通用方法论文精选"><title>AI Daily · 每日研究简报</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
:root{--ink:#232b28;--muted:#73796e;--green:#255b47;--line:#dcded3;--accent:#e7ed9e}*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:var(--ink);font:15px/1.8 system-ui,-apple-system,sans-serif}a{color:inherit}header,main,footer{max-width:1240px;margin:auto;padding:24px 40px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:850;letter-spacing:-1px}.brand span{font-size:12px;letter-spacing:2px;color:var(--muted);margin-left:15px}header a{font-size:12px;text-decoration:none}.hero{position:relative;padding:55px 0 40px;max-width:850px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:700}h1{font:600 clamp(34px,4.2vw,54px)/1.4 "Noto Serif SC",Georgia,serif;letter-spacing:-1px;margin:18px 0}h1 em{font-style:normal;color:var(--green)}.hero p{max-width:640px;color:var(--muted);font-size:15px}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--ink)}input,select,button{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;padding:10px 14px;border-radius:4px}input{flex:1;min-width:170px}button{cursor:pointer}button:hover{background:#e8eadf}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a7732f;outline-offset:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 28px}.filters button{font-size:13px;border:0;border-radius:3px}.filters button[aria-pressed=true]{background:var(--green);color:white}.edition{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:15px}.edition h2{font:600 24px "Noto Serif SC",serif;margin:0}.muted,#status,#intro{font-size:12px;color:var(--muted)}#intro{max-width:850px;margin:14px 0 26px}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}article{background:#fffef9;padding:30px;border:1px solid var(--line);display:flex;flex-direction:column;border-radius:5px;transition:box-shadow .2s}article:hover{box-shadow:0 10px 30px #23392e09}article.featured{grid-column:1/-1;background:#e9eddf;border-color:#c4cdb7;display:grid;grid-template-columns:1.1fr 1fr;column-gap:45px;padding:38px}.featured .meta,.featured .editor-title,.featured .hook{grid-column:1}.featured .original-title{grid-column:1}.featured .reading-link{grid-column:2;grid-row:2/5;align-self:center}.featured details,.featured .source{grid-column:1/-1}.meta{display:flex;justify-content:space-between;gap:15px;font-size:11px;letter-spacing:1px;color:var(--green);text-transform:uppercase}.badge{background:var(--green);color:#fff;padding:3px 7px}.editor-title{font:600 25px/1.6 "Noto Serif SC",Georgia,serif;margin:17px 0 12px;letter-spacing:-.4px}.featured .editor-title{font-size:32px}.original-title{font-size:11px;color:var(--muted);margin:0 0 12px}.hook{font-size:15px;color:#4e5c52;margin:0 0 22px}.reading-link{border-left:3px solid #b3bd71;padding:4px 0 4px 18px;margin:3px 0 23px}.reading-link h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:0 0 7px;color:var(--green)}.reading-link p{font-size:14px;margin:0 0 10px;line-height:1.9}.question{font-size:12px!important;color:var(--muted)}details{margin-top:auto;border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-size:13px;color:var(--green)}.reading-section{padding-top:14px}.reading-section h4{font-size:13px;margin:0 0 5px;color:var(--green)}.reading-section p{font-size:14px;line-height:1.95;margin:0 0 9px}.detail{font-size:14px;color:var(--muted);white-space:pre-line}.source{display:flex;justify-content:space-between;align-items:center;margin-top:9px;background:var(--ink);color:white;text-decoration:none;padding:12px 16px;font-size:13px}.source:hover{background:var(--green)}.source span{font-size:11px;opacity:.7}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed var(--line)}footer{border-top:1px solid var(--line);margin-top:45px;font-size:11px;color:var(--muted)}@media(max-width:720px){header,main,footer{padding:20px}.brand span{display:none}.hero{padding:30px 0}#grid{grid-template-columns:1fr}article,article.featured{display:flex;padding:24px}.featured .editor-title{font-size:27px}.editor-title{font-size:23px}.edition{gap:12px}.edition h2{font-size:20px}}
</style></head><body><header><div class="brand">AI DAILY <span>/ 研究简报</span></div><a href="https://github.com/Wangchat666/AI-Daily">查看归档仓库 ↗</a></header><main><section class="hero"><div class="eyebrow">NEWS · PAPERS · IDEAS</div><h1>信息很多，<br><em>值得深读的有这些。</em></h1><p>从 AI 动态到专业研究，为你挑出关键发现、解释阅读价值，并把真正值得追问的问题带回原文。</p><div id="status" role="status">正在加载日报…</div></section><div class="controls"><select id="date" aria-label="选择日报日期"></select><input id="search" type="search" placeholder="搜索标题、方法或关键词…" aria-label="搜索日报"><button id="refresh">刷新内容 ↻</button></div><nav class="filters" aria-label="领域筛选"></nav><section><div class="edition"><h2 id="heading">每日精选</h2><span id="count" class="muted"></span></div><p id="intro"></p><div id="grid"></div></section></main><footer>AI Daily · 日期采用北京时间。论文标明原始发布日期；预印本结论尚待进一步验证。本站提供研究资讯，不构成医疗或法律建议。<noscript>请启用 JavaScript 查看日报，或在仓库 data/daily.json 阅读原始内容。</noscript></footer>
<script>
let db={issues:[]},category='全部';const $=id=>document.getElementById(id);
const categories=['全部','AI 动态','知识产权','生物医疗','通用方法'];
for(const c of categories){const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};document.querySelector('.filters').append(b)}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e}
function render(){
const issue=db.issues.find(x=>x.date===$('date').value);$('grid').replaceChildren();$('heading').textContent=issue?issue.date+' / 本期阅读清单':'本期阅读清单';$('intro').textContent=issue?.intro||'';
const q=$('search').value.trim().toLowerCase();
const items=(issue?.items||[]).filter(x=>(category==='全部'||x.category===category)&&[x.title,x.editorial_title,x.hook,x.read_reason,x.read_question,x.summary,x.detail,...(x.sections||[]).map(s=>s.heading+' '+s.text)].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(!!b.featured)-Number(!!a.featured));
$('count').textContent=items.length+' 篇 · 追溯一手来源';
for(const x of items){
const card=el('article','',x.featured?'featured':'');const meta=el('div','','meta');
meta.append(el('span',x.priority||x.category+' / '+x.type,x.featured?'badge':''),el('span',x.published));card.append(meta,el('h3',x.editorial_title||x.title,'editor-title'));
if(x.editorial_title)card.append(el('p',x.title,'original-title'));card.append(el('p',x.hook||x.summary,'hook'));
if(x.read_reason){const reason=el('div','','reading-link');reason.append(el('h4','WHY READ / 为什么读原文'),el('p',x.read_reason));if(x.read_question)reason.append(el('p',x.read_question,'question'));card.append(reason)}
const details=el('details');details.append(el('summary','展开研究笔记 · 方法、证据与局限'));
if(x.sections?.length){for(const s of x.sections){const block=el('section','','reading-section');block.append(el('h4',s.heading),el('p',s.text));details.append(block)}}else details.append(el('p',x.summary),el('p',x.detail,'detail'));
card.append(details);
try{const u=new URL(x.url);if(['https:','http:'].includes(u.protocol)){const link=el('a',x.type==='论文'?'前往原文，深入研究 ↗':'阅读完整报道 ↗','source');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';link.append(el('span',u.hostname.replace('www.','')));card.append(link)}}catch{}
$('grid').append(card)}
if(!items.length)$('grid').append(el('div',issue?'没有匹配内容，试试其他关键词或分类。':'首期日报正在准备中。','empty'));
}
async function refresh(){const button=$('refresh');button.disabled=true;try{const r=await fetch('./data/daily.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const next=await r.json();if(!Array.isArray(next.issues))throw Error('数据格式异常');db=next;db.issues.sort((a,b)=>b.date.localeCompare(a.date));const prev=$('date').value;$('date').replaceChildren();for(const issue of db.issues){const option=el('option',issue.date);option.value=issue.date;$('date').append(option)}if(db.issues.some(x=>x.date===prev))$('date').value=prev;const t=new Date(db.updated_at);$('status').textContent='最新一期：'+(db.issues[0]?.date||'待发布')+' · 内容同步：'+(isNaN(t)?'未知':t.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}));render()}catch(e){$('status').textContent='更新失败，请稍后点击刷新。'+(db.issues.length?' 当前保留已加载内容。':'');if(!db.issues.length)render()}finally{button.disabled=false}}
$('date').onchange=render;$('search').oninput=render;$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},300000);
</script></body></html>

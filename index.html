<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="每日 AI 新闻与知识产权、生物医疗、通用方法论文精选"><title>AI Daily · 每日研究简报</title>
<style>
:root{color-scheme:light;--ink:#18342f;--muted:#62716b;--line:#dce4dc;--green:#245c45}*{box-sizing:border-box}body{margin:0;background:#f6f7f1;color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--green)}header,main,footer{max-width:1180px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:2px}.brand span{color:#7c9586;font-weight:400}header a{font-size:13px;text-decoration:none}.hero{padding:48px 0 32px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green)}h1{font-size:clamp(32px,5vw,58px);line-height:1.2;margin:16px 0}h1 em{font-style:normal;color:#64836b}.hero p{color:var(--muted);max-width:640px}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--line)}select,input,button{font:inherit;border:1px solid #cbd6ca;border-radius:8px;background:#fff;padding:9px 12px;color:var(--ink)}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{background:#e4ecdf}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b58c38;outline-offset:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.filters button{font-size:14px;border-radius:24px}.filters button[aria-pressed=true]{color:white;background:var(--green);border-color:var(--green)}.edition{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.edition h2{font-size:23px;margin:0}.muted,#status,#intro{color:var(--muted);font-size:14px}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}article{border:1px solid var(--line);background:#fff;padding:26px;border-radius:14px;display:flex;flex-direction:column}article h3{font-size:21px;line-height:1.5;margin:14px 0}article p{margin:0 0 16px;color:#465b51}.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--green)}.detail{padding:12px 15px;background:#f4f6ef;border-radius:8px;font-size:14px;margin-bottom:20px}.source{margin-top:auto;font-size:14px;text-decoration:none;font-weight:600}.empty{padding:35px;border:1px dashed var(--line);grid-column:1/-1}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:40px}@media(max-width:650px){header,main,footer{padding:20px}#grid{grid-template-columns:1fr}.hero{padding:30px 0}article{padding:20px}.edition{display:block}}
#grid{grid-template-columns:1fr;max-width:920px;margin:24px auto}article{padding:32px 40px}article h3{font-size:26px}.reading-section{margin:8px 0}.reading-section h4{font-size:15px;color:var(--green);margin:8px 0}.reading-section p{line-height:1.95;margin-bottom:12px}.detail{white-space:pre-line}@media(max-width:650px){article{padding:22px}article h3{font-size:22px}}</style></head><body><header><div class="brand">AI DAILY <span>/ 研究简报</span></div><a href="https://github.com/Wangchat666/AI-Daily">查看归档仓库 ↗</a></header><main><section class="hero"><div class="eyebrow">NEWS · PAPERS · IDEAS</div><h1>追踪 AI 进展，<br><em>找到值得读的研究。</em></h1><p>聚焦知识产权、生物医疗与通用方法。新闻追溯来源，论文关注方法、证据和应用价值。</p><div id="status" role="status">正在加载日报…</div></section><div class="controls"><select id="date" aria-label="选择日报日期"></select><input id="search" type="search" placeholder="搜索标题、方法或关键词…" aria-label="搜索日报"><button id="refresh">刷新内容 ↻</button></div><nav class="filters" aria-label="领域筛选"></nav><section><div class="edition"><h2 id="heading">每日精选</h2><span id="count" class="muted"></span></div><p id="intro"></p><div id="grid"></div></section></main><footer>AI Daily · 日期采用北京时间。论文标明原始发布日期；预印本结论尚待进一步验证。本站提供研究资讯，不构成医疗或法律建议。<noscript>请启用 JavaScript 查看日报，或在仓库 data/daily.json 阅读原始内容。</noscript></footer>
<script>
let db={issues:[]},category='全部';const $=id=>document.getElementById(id);
const categories=['全部','AI 动态','知识产权','生物医疗','通用方法'];
for(const c of categories){const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',c===category);b.onclick=()=>{category=c;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};document.querySelector('.filters').append(b)}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e}
function render(){const issue=db.issues.find(x=>x.date===$('date').value);$('grid').replaceChildren();$('heading').textContent=issue?issue.date+' / 每日精选':'每日精选';$('intro').textContent=issue?.intro||'';const q=$('search').value.trim().toLowerCase();const items=(issue?.items||[]).filter(x=>(category==='全部'||x.category===category)&&[x.title,x.summary,x.detail,...(x.sections||[]).map(s=>s.heading+' '+s.text)].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+' 条内容';for(const x of items){const a=el('article');const meta=el('div','', 'meta');meta.append(el('span',x.category+' · '+x.type),el('span',x.published));a.append(meta,el('h3',x.title),el('p',x.summary));for(const s of (x.sections||[])){const block=el('section','','reading-section');block.append(el('h4',s.heading),el('p',s.text));a.append(block)}if(x.detail)a.append(el('div',x.detail,'detail'));try{const u=new URL(x.url);if(u.protocol==='https:'||u.protocol==='http:'){const link=el('a','阅读原文 ↗','source');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';a.append(link)}}catch{}$('grid').append(a)}if(!items.length)$('grid').append(el('div',issue?'没有匹配的内容，请切换分类或搜索词。':'首期日报正在准备中。','empty'))}
async function refresh(){const button=$('refresh');button.disabled=true;try{const r=await fetch('./data/daily.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const next=await r.json();if(!Array.isArray(next.issues))throw Error('数据格式异常');db=next;db.issues.sort((a,b)=>b.date.localeCompare(a.date));const prev=$('date').value;$('date').replaceChildren();for(const issue of db.issues){const option=el('option',issue.date);option.value=issue.date;$('date').append(option)}if(db.issues.some(x=>x.date===prev))$('date').value=prev;const t=new Date(db.updated_at);$('status').textContent='最新一期：'+(db.issues[0]?.date||'待发布')+' · 内容同步：'+(isNaN(t)?'未知':t.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}));render()}catch(e){$('status').textContent='更新失败，请稍后点击刷新。'+(db.issues.length?' 当前保留已加载内容。':'');if(!db.issues.length)render()}finally{button.disabled=false}}
$('date').onchange=render;$('search').oninput=render;$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},300000);
</script></body></html>
